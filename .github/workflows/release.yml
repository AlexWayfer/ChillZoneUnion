name: Test and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chillzoneunion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate addon versions and package manifest
        shell: pwsh
        run: ./tools/package.ps1 -ValidateOnly
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1
      - name: Run the simulation and access-control regressions
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d "$RUNNER_TEMP/chillzoneunion-tests.XXXXXX")"
          ln -s "$GITHUB_WORKSPACE" "$staging/ChillZoneUnion"
          cd "$staging"
          lua5.1 ChillZoneUnion/Tests/simulation.lua
          lua5.1 ChillZoneUnion/Tests/security.lua

  release:
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and verify the 26-file addon ZIP
        id: package
        shell: pwsh
        run: ./tools/package.ps1
      - name: Create, verify and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-Api([string]$Path) {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/$Path"
            $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
            if ($response.StatusCode -eq 404) { return }
            if ($response.StatusCode -ne 200) { throw "GitHub API request failed with HTTP $($response.StatusCode): $Path" }
            return $response.Content | ConvertFrom-Json
          }
          function Tag-Commit([string]$Tag) {
            $reference = Read-Api ('git/ref/tags/' + [Uri]::EscapeDataString($Tag))
            if ($null -eq $reference) { return $null }
            $object = $reference.object
            for ($depth = 0; $depth -lt 8; $depth++) {
              if ($object.type -eq 'commit') { return [string]$object.sha }
              if ($object.type -ne 'tag') { throw 'Release tag does not resolve to a commit.' }
              $annotated = Read-Api ('git/tags/' + $object.sha)
              if ($null -eq $annotated) { throw 'Annotated tag object is missing.' }
              $object = $annotated.object
            }
            throw 'Release tag nesting exceeds the safety limit.'
          }
          function Find-Release([string]$Tag) {
            $release = Read-Api ('releases/tags/' + [Uri]::EscapeDataString($Tag))
            if ($null -ne $release) { return $release }
            # The tag endpoint can omit unpublished drafts; the authenticated list includes them.
            for ($page = 1; $page -le 100; $page++) {
              $items = @(Read-Api "releases?per_page=100&page=$page")
              foreach ($item in $items) { if ($item.tag_name -ceq $Tag) { return $item } }
              if ($items.Count -lt 100) { return }
            }
            throw 'Release lookup exceeded its pagination safety limit.'
          }
          $tag = $env:RELEASE_TAG
          $existing = Find-Release $tag
          if ($null -ne $existing) {
            if ($existing.draft) { throw "A draft of $tag already exists. Inspect or remove that draft before retrying; this run will not silently publish or replace it." }
            Write-Output "Release $tag already exists; its tag and assets will remain unchanged."
            return
          }
          $existingCommit = Tag-Commit $tag
          if ($null -ne $existingCommit -and $existingCommit -cne $env:GITHUB_SHA) {
            throw "Tag $tag already exists at a different commit; refusing to move it."
          }
          $notes = Join-Path $env:GITHUB_WORKSPACE ('.github/releases/' + $env:RELEASE_VERSION + '.md')
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes are required: $notes" }
          if ($null -eq $existingCommit) {
            # Draft releases do not necessarily create their Git tag until publication.
            & gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" --raw-field "ref=refs/tags/$tag" --raw-field "sha=$env:GITHUB_SHA" --silent
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag; no draft was published.' }
          }
          if ((Tag-Commit $tag) -cne $env:GITHUB_SHA) { throw 'The release tag must point to the exact tested commit.' }
          $isPrerelease = $env:RELEASE_VERSION.Contains('-')
          $create = @('release', 'create', $tag, $env:RELEASE_ARCHIVE, '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA, '--verify-tag', '--draft', '--title', "ChillZoneUnion $env:RELEASE_VERSION", '--notes-file', $notes)
          if ($isPrerelease) { $create += @('--prerelease', '--latest=false') }
          & gh @create
          if ($LASTEXITCODE -ne 0) { throw 'Draft release or asset upload failed; inspect the draft before retrying.' }
          if ((Tag-Commit $tag) -cne $env:GITHUB_SHA) { throw 'Release tag does not match the tested commit; the release remains a draft.' }
          $draft = Find-Release $tag
          if ($null -eq $draft -or -not $draft.draft) { throw 'The expected draft release could not be verified.' }
          $fileName = Split-Path -Leaf $env:RELEASE_ARCHIVE
          $assets = @($draft.assets | Where-Object { $_.name -ceq $fileName -and $_.state -eq 'uploaded' })
          if ($assets.Count -ne 1) { throw 'The draft is missing its completed addon ZIP asset.' }
          $verifyDir = Join-Path $env:RUNNER_TEMP ('chillzoneunion-asset-' + [Guid]::NewGuid().ToString('N'))
          [IO.Directory]::CreateDirectory($verifyDir) | Out-Null
          & gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $fileName --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the draft asset for verification.' }
          $uploadedHash = (Get-FileHash -LiteralPath (Join-Path $verifyDir $fileName) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($uploadedHash -cne $env:RELEASE_SHA256) { throw 'Uploaded ZIP checksum mismatch; the release remains a draft.' }
          $publish = @('release', 'edit', $tag, '--repo', $env:GITHUB_REPOSITORY, '--draft=false')
          if ($isPrerelease) { $publish += @('--prerelease', '--latest=false') }
          & gh @publish
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; inspect the verified draft before retrying.' }
          $published = Read-Api ('releases/tags/' + [Uri]::EscapeDataString($tag))
          if ($null -eq $published -or $published.draft -or [bool]$published.prerelease -ne $isPrerelease) {
            throw 'The final release state could not be verified.'
          }
          Write-Output "Published $($published.html_url) from tested commit $env:GITHUB_SHA"
